<!doctype html>
<!-- Device mockup for the README.
     Raw screenshots live in ../raw/ (covers pixelated), rendered images go to ../ (see scripts/render_mockups.py). -->
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  .stage { display: flex; align-items: center; justify-content: center;
           background: radial-gradient(1200px 700px at 30% 20%, #e8f1ff 0%, #dfe7f3 45%, #cfd9e8 100%); }
  .tablet { position: relative; background: linear-gradient(145deg, #2b2d31, #121315); border-radius: 46px; padding: 26px;
            box-shadow: 0 50px 90px -20px rgba(16,24,40,.45), 0 18px 36px -12px rgba(16,24,40,.35), inset 0 0 0 2px rgba(255,255,255,.06); }
  .tablet::before { content: ""; position: absolute; top: 11px; left: 50%; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: #3a3d44; }
  .screen { overflow: hidden; border-radius: 18px; background: #eaebee; padding: 10px 14px; }
  .screen img { display: block; width: 100%; }
</style></head>
<body>

<!-- tablet-card.png: card in light mode, portrait tablet -->
<div id="tablet-card" class="stage" style="width:1000px;height:1200px">
  <div class="tablet" style="width:760px">
    <div class="screen"><img src="../raw/card-light.png"></div>
  </div>
</div>

</body></html>
